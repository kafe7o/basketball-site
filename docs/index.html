    ${(g.edges || []).length ? `<div class="small" style="margin-top:6px">Цена над честната: ${g.edges.map(e => `<span class="edge">${esc(edgeLabel(g, e))} @${e.price.toFixed(2)} ${esc(book(e.book))} +${(e.edge * 100).toFixed(1)}%</span>`).join(" ")}</div>` : ""}</div>`;
}
function renderGames() {
  const up = DATA.upcoming || [];
  document.getElementById("t-games").innerHTML = up.length ? `<p class="small muted">Мачовете до 36 часа напред. „Роботът“ е собственият модел; „Честно“ - шансът на Pinnacle без маржа (най-точният букмейкър).
      <b>„Залагай от“</b> = честната цена + 3%: ако Mr Bit (или друг твой букмейкър) дава поне толкова за изхода - цената е над честната; ако дава по-малко - не си струва.
      Пазарът почти винаги е по-точен от робота - сравнението се мери в „Резултати“.</p>` + up.map(gameCard).join("")
    : `<div class="empty">Няма мачове в следващите 36 часа (или цените още не са изтеглени).</div>`;
}
function renderEdges() {
  const list = [];
  (DATA.upcoming || []).forEach(g => (g.edges || []).forEach(e => list.push([g, e])));
  const r = DATA.results.by_league || {};
  const live = Object.values(r).reduce((a, v) => ({n: a.n + (v.edges || 0), h: a.h + (v.edge_hits || 0), pay: a.pay + (v.edge_return || 0) * (v.edges || 0)}), {n: 0, h: 0, pay: 0});
  document.getElementById("t-edges").innerHTML = `<div class="note"><b>Какво е това:</b> честният шанс е на Pinnacle без маржа. Ако някой букмейкър плаща поне <b>3% повече</b> от честната цена, изходът е тук.
      Във футбола това е единственото, което назад е на плюс във всеки период (+1.7% до +8.6% от заложеното, 2012-2026) - роботът не участва. Тук е мерено на живо от днес.
      Букмейкърите в списъка (от odds API, Европа) може да не работят в България - сравни с колоната „Залагай от“ в „Мачове“: ако Mr Bit дава поне толкова, е същото.
      Меките букмейкъри ограничават печелившите. Не е сигурен залог.</div>
    <div class="tiles"><div class="tile"><div class="k">Днес и утре</div><div class="v">${list.length}</div><div class="s">изхода над честната</div></div>
      <div class="tile"><div class="k">На живо досега</div><div class="v">${live.n ? `${live.h}/${live.n}` : "–"}</div><div class="s">${live.n ? `връщат ${(live.pay / live.n).toFixed(2)} € от 1 €` : "още няма уредени"}</div></div></div>` +
    (list.length ? list.map(([g, e]) => `<div class="card"><div class="top"><span class="tm">${fmtDay(g.tip)} ${fmtTime(g.tip)}</span><span class="teams">${esc(g.home)} – ${esc(g.away)}</span>
        <span class="lg">${LG(g.league).flag || ""} ${esc(LG(g.league).title || "")}</span></div>
        <div style="margin-top:6px"><span class="edge">${esc(edgeLabel(g, e))}</span> · <b>@${e.price.toFixed(2)}</b> при ${esc(book(e.book))} · честна цена ${(1 / e.fair).toFixed(2)} · <b>+${(e.edge * 100).toFixed(1)}%</b></div></div>`).join("")
      : `<div class="empty">Сега няма изход с цена поне 3% над честната.</div>`);
}
function renderResults() {
  const R = DATA.results, bl = R.by_league || {};
  const rows = Object.entries(bl).map(([k, v]) => `<tr><td>${LG(k).flag || ""} ${esc(LG(k).title || k)}</td><td class="r">${v.n}</td>
      <td class="r">${v.brier_model == null ? "–" : v.brier_model.toFixed(3)}</td><td class="r">${v.brier_market == null ? "–" : v.brier_market.toFixed(3)}</td>
      <td class="r">${v.edges ? `${v.edge_hits}/${v.edges}` : "–"}</td><td class="r">${v.edge_return == null ? "–" : v.edge_return.toFixed(2) + " €"}</td></tr>`).join("");
  const bt = DATA.backtest;
  document.getElementById("t-res").innerHTML = `<h2>На живо (записът преди мача)</h2>` + (R.settled ? `<table class="mk"><tr><th>Първенство</th><th class="r">Мачове</th><th class="r">Грешка робот</th><th class="r">Грешка пазар</th><th class="r">Цена над честната</th><th class="r">Връща от 1 €</th></tr>${rows}</table>
      <p class="small muted">„Грешка“ = Brier за победителя (по-малко е по-добре). Малка извадка - не прави изводи преди поне 200 мача.</p>` : `<div class="empty">Още няма уредени мачове - записът е от 14.10.2026.</div>`)
    + (bt ? `<h2>Назад (проверка по протокол)</h2><div class="note">${bt.summary_html || ""}</div>` : "")
    + ((R.recent || []).length ? `<h2>Последни мачове</h2>` + R.recent.map(g => `<div class="card"><div class="top"><span class="tm">${fmtDay(g.tip)}</span><span class="teams">${esc(g.home)} ${g.hp}:${g.ap} ${esc(g.away)}</span>
        <span class="lg">${LG(g.league).flag || ""} ${esc(LG(g.league).title || "")}</span></div>
        <div class="small muted">Победа на домакина: роботът ${g.model ? pct(g.model.h2h[0]) : "–"}, пазарът ${g.fair && g.fair.h2h ? pct(g.fair.h2h.p[0]) : "–"} · излезе ${g.hp > g.ap ? "домакинът" : "гостът"}</div></div>`).join("") : "");
}
function renderHow() {
  const h = DATA.history || {};
  document.getElementById("t-how").innerHTML = `<div class="note"><b>Какво прави роботът.</b> За всеки мач в НБА и Евролигата: рейтинг за атака и защита на всеки отбор (от резултатите, по-новите мачове тежат повече),
      предимство на домакина и умора при втори мач в два поредни дни. От тях - очаквана разлика и общ брой точки, и шансове за победа, хендикап и над/под.</div>
    <div class="note"><b>Честно:</b> пазарът (особено Pinnacle) е по-точен от робота - това се мери, не се предполага. Печалба може да дойде само от по-добра цена: затова е табът „Цена над честната“.
      Записът е преди мача и не се променя. Без размер на залога, без „сигурен залог“.</div>
    <div class="note"><b>Данни:</b> резултати - ESPN (НБА) и официалният сайт на Евролигата; цени - the-odds-api (регион eu, с Pinnacle); историята в базата:
      ${Object.entries(h).map(([k, v]) => `${esc(LG(k).title || k)} ${v.n} мача от ${fmtDay(v.first)}`).join("; ")}.</div>`;
}
renderGames(); renderEdges(); renderResults(); renderHow();
const start = (location.hash || "").slice(1);
selectTab(tabs.some(t => t[0] === start) ? start : "t-games");
</script>
</body>
</html>
